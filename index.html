<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef7ff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Wo ist was?"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Wo ist was?</title></head><body>
<header><div><small>HAUS-SUCHMASCHINE</small><h1>Wo ist was?</h1><p>Finde Dinge, bevor du sie noch einmal kaufst. 😄</p></div></header>
<main><section class="search"><b>Was suchst du?</b><input id="q" type="search" placeholder="z. B. Blumendraht, G9, Batterien"></section>
<div class="head"><div><h2>Alle Dinge</h2><span id="count"></span></div><button id="add">＋ Eintragen</button></div><div id="list"></div></main>
<dialog id="dlg"><form id="form"><h2 id="title">Eintrag</h2><input id="id" type="hidden">
<label>Name*<input id="name" required></label><label>Symbol<div class="symrow"><input id="symbol" maxlength="4" placeholder="💡"><button type="button" id="suggest">Vorschlagen</button></div><div id="choices"></div></label>
<label>Raum / Bereich*<input id="room" required></label><label>Genauer Ort<input id="loc"></label><label>Suchbegriffe<input id="keys" placeholder="mit Kommas trennen"></label><label>Notiz<textarea id="note"></textarea></label>
<div class="actions"><button type="button" id="del">Löschen</button><button type="button" id="cancel">Abbrechen</button><button type="submit">Speichern</button></div></form></dialog>
<script src="app.js"></script></body></html>
