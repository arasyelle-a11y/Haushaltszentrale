name: Supabase Keepalive

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Keep Supabase active
        run: |
          set -e
          API_KEY=$(grep 'const SUPABASE_KEY' app.js | head -1 | cut -d '"' -f 2)
          BASE_URL="https://muujfgwspkoogjxtvcrp.supabase.co/rest/v1/keepalive"

          for QUERY in             "?select=id&limit=1"             "?select=id,created_at&limit=1"             "?select=id&order=id.desc&limit=1"             "?select=id&order=id.asc&limit=1"
          do
            curl --fail --silent --show-error               "$BASE_URL$QUERY"               -H "apikey: $API_KEY"
            echo
          done
